name: Process-PSModule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
    types:
      - closed
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write
  pages: write
  id-token: write

jobs:
  Process-PSModule:
    uses: PSModule/Process-PSModule/.github/workflows/workflow.yml@8fa878aabbbafe5981e39825cb196d295cdf273e # v8.0.5
    secrets:
      APIKey: ${{ secrets.APIKey }}
      TestData: >-
        {
          "secrets": {
            "CONFLUENCE_API_TOKEN": "${{ secrets.CONFLUENCE_API_TOKEN }}"
          },
          "variables": {
            "CONFLUENCE_SITE": "${{ vars.CONFLUENCE_SITE }}",
            "CONFLUENCE_USERNAME": "${{ vars.CONFLUENCE_USERNAME }}",
            "CONFLUENCE_SPACE_KEY": "${{ vars.CONFLUENCE_SPACE_KEY }}"
          }
        }
